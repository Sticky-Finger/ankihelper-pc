name: 构建发布

on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: 构建后是否创建草稿 Release（不勾选 = 只构建，供测试）
        type: boolean
        required: false
        default: false
      release_version:
        description: 草稿 Release 版本号（勾选「创建草稿」时填写，如 v1.0.1）
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64
          - os: macos-latest
            flutter-arch: arm64
            artifact-name: ankihelper-macos-arm64
            build-flavor: macos-arm64
          # macOS x86_64
          - os: macos-latest
            flutter-arch: x64
            artifact-name: ankihelper-macos-x64
            build-flavor: macos-x64
          - os: windows-latest
            flutter-arch: x64
            artifact-name: ankihelper-windows-x64
            build-flavor: windows
          - os: ubuntu-22.04
            flutter-arch: x64
            artifact-name: ankihelper-linux-x64
            build-flavor: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    env:
      # 手动发版：用输入的版本号；打 tag：用 tag 名；其余（手动纯构建）：dev
      APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_version || 'dev') || github.ref_name }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: 安装 Rosetta (x86_64 构建所需)
        if: matrix.flutter-arch == 'x64' && runner.os == 'macOS'
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: ${{ matrix.flutter-arch }}
          cache: true

      - name: 验证 Flutter 环境
        run: flutter doctor

      - name: 缓存 Pub 依赖
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ matrix.flutter-arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ matrix.flutter-arch }}-

      - name: 安装项目依赖
        run: flutter pub get

      - name: 代码静态分析
        run: flutter analyze

      - name: 运行测试
        run: flutter test

      - name: 构建应用 (macOS arm64)
        if: matrix.build-flavor == 'macos-arm64'
        run: flutter build macos --release

      - name: 构建应用 (macOS x86_64 — Rosetta)
        if: matrix.build-flavor == 'macos-x64'
        run: arch -x86_64 flutter build macos --release

      - name: 构建应用 (Windows)
        if: matrix.build-flavor == 'windows'
        run: flutter build windows --release

      - name: 打包 Windows 压缩包
        if: matrix.build-flavor == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "${{ matrix.artifact-name }}-${{ env.APP_VERSION }}.zip" -Force

      - name: 构建应用 (Linux)
        if: matrix.build-flavor == 'linux'
        run: flutter build linux --release

      - name: 打包 Linux 压缩包
        if: matrix.build-flavor == 'linux'
        run: |
          tar -czf "${{ matrix.artifact-name }}-${{ env.APP_VERSION }}.tar.gz" -C build/linux/x64/release/bundle .

      - name: 安装 create-dmg (macOS)
        if: startsWith(matrix.build-flavor, 'macos')
        run: brew install create-dmg

      # ========= 将 .app 打包为 .dmg =========
      - name: 打包 macOS DMG (arm64)
        if: matrix.build-flavor == 'macos-arm64'
        run: |
          # 清理 .app 以外的多余文件（如 .dSYM 等）
          cd build/macos/Build/Products/Release
          find . -mindepth 1 -maxdepth 1 -not -name '*.app' -exec rm -rf {} +

          APP_NAME=$(ls | grep '\.app$' | head -n 1 | sed 's/\.app$//')
          create-dmg \
            --volname "${APP_NAME}" \
            --volicon "${APP_NAME}.app/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 150 190 \
            --hide-extension "${APP_NAME}.app" \
            --app-drop-link 450 190 \
            "${{ github.workspace }}/${{ matrix.artifact-name }}-${{ env.APP_VERSION }}.dmg" \
            .

      - name: 打包 macOS DMG (x64)
        if: matrix.build-flavor == 'macos-x64'
        run: |
          # 清理 .app 以外的多余文件（如 .dSYM 等）
          cd build/macos/Build/Products/Release
          find . -mindepth 1 -maxdepth 1 -not -name '*.app' -exec rm -rf {} +

          APP_NAME=$(ls | grep '\.app$' | head -n 1 | sed 's/\.app$//')
          create-dmg \
            --volname "${APP_NAME}" \
            --volicon "${APP_NAME}.app/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 150 190 \
            --hide-extension "${APP_NAME}.app" \
            --app-drop-link 450 190 \
            "${{ github.workspace }}/${{ matrix.artifact-name }}-${{ env.APP_VERSION }}.dmg" \
            .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}-${{ env.APP_VERSION }}.*
          if-no-files-found: error

  release:
    name: 发布草稿 Release
    needs: build
    runs-on: ubuntu-latest
    # 打 tag（=决定发版）或手动勾选「创建草稿 Release」时执行；手动纯构建时不执行
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.create_draft_release == 'true') }}
    permissions:
      contents: write
    steps:
      # 打 tag 用 tag 名；手动勾选用输入版本号（留空则报错）
      - name: 计算发布版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ inputs.release_version }}" ]; then
            echo "已勾选「创建草稿 Release」但未填写版本号，请填写如 v1.0.1"
            exit 1
          else
            echo "tag=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 创建草稿 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ steps.version.outputs.tag }}
          name: Anki划词助手 ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: true