name: 构建发布

on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: 构建后是否创建草稿 Release（不勾选 = 只构建，供测试）
        type: boolean
        required: false
        default: false
      release_version:
        description: 草稿 Release 版本号（勾选「创建草稿」时填写，如 v1.0.1）
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64
          - os: macos-latest
            flutter-arch: arm64
            artifact-name: ankihelper-macos-arm64
            build-flavor: macos-arm64
          # macOS x86_64
          - os: macos-latest
            flutter-arch: x64
            artifact-name: ankihelper-macos-x64
            build-flavor: macos-x64
          - os: windows-latest
            flutter-arch: x64
            artifact-name: ankihelper-windows-x64
            build-flavor: windows
          - os: ubuntu-22.04
            flutter-arch: x64
            artifact-name: ankihelper-linux-x64
            build-flavor: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算产物版本号
        # 在 step 里读输入（job 级 env 读 inputs 不可靠）：打 tag 用 tag 名；手动填了版本号用它；否则 dev
        # Windows runner 默认 shell 是 pwsh，需显式指定 bash
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "APP_VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
          elif [ -n "${{ github.event.inputs.release_version }}" ]; then
            echo "APP_VERSION=${{ github.event.inputs.release_version }}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=dev" >> "$GITHUB_ENV"
          fi

      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: 安装 Rosetta (x86_64 构建所需)
        if: matrix.flutter-arch == 'x64' && runner.os == 'macOS'
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: ${{ matrix.flutter-arch }}
          cache: true

      - name: 验证 Flutter 环境
        run: flutter doctor

      - name: 缓存 Pub 依赖
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ matrix.flutter-arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ matrix.flutter-arch }}-

      - name: 安装项目依赖
        run: flutter pub get

      - name: 代码静态分析
        run: flutter analyze

      - name: 运行测试
        run: flutter test

      - name: 构建应用 (macOS arm64)
        if: matrix.build-flavor == 'macos-arm64'
        run: flutter build macos --release

      - name: 构建应用 (macOS x86_64 — Rosetta)
        if: matrix.build-flavor == 'macos-x64'
        run: arch -x86_64 flutter build macos --release

      - name: 构建应用 (Windows)
        if: matrix.build-flavor == 'windows'
        run: flutter build windows --release

      - name: 打包 Windows 压缩包
        if: matrix.build-flavor == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "${{ matrix.artifact-name }}-${{ env.APP_VERSION }}.zip" -Force

      - name: 构建应用 (Linux)
        if: matrix.build-flavor == 'linux'
        run: flutter build linux --release

      - name: 打包 Linux 压缩包
        if: matrix.build-flavor == 'linux'
        run: |
          tar -czf "${{ matrix.artifact-name }}-${{ env.APP_VERSION }}.tar.gz" -C build/linux/x64/release/bundle .

      - name: 安装 create-dmg (macOS)
        if: startsWith(matrix.build-flavor, 'macos')
        run: brew install create-dmg

      # ========= 将 .app 打包为 .dmg =========
      - name: 打包 macOS DMG (arm64)
        if: matrix.build-flavor == 'macos-arm64'
        run: |
          # 清理 .app 以外的多余文件（如 .dSYM 等）
          cd build/macos/Build/Products/Release
          find . -mindepth 1 -maxdepth 1 -not -name '*.app' -exec rm -rf {} +

          APP_NAME=$(ls | grep '\.app$' | head -n 1 | sed 's/\.app$//')
          create-dmg \
            --volname "${APP_NAME}" \
            --volicon "${APP_NAME}.app/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 150 190 \
            --hide-extension "${APP_NAME}.app" \
            --app-drop-link 450 190 \
            "${{ github.workspace }}/${{ matrix.artifact-name }}-${{ env.APP_VERSION }}.dmg" \
            .

      - name: 打包 macOS DMG (x64)
        if: matrix.build-flavor == 'macos-x64'
        run: |
          # 清理 .app 以外的多余文件（如 .dSYM 等）
          cd build/macos/Build/Products/Release
          find . -mindepth 1 -maxdepth 1 -not -name '*.app' -exec rm -rf {} +

          APP_NAME=$(ls | grep '\.app$' | head -n 1 | sed 's/\.app$//')
          create-dmg \
            --volname "${APP_NAME}" \
            --volicon "${APP_NAME}.app/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 150 190 \
            --hide-extension "${APP_NAME}.app" \
            --app-drop-link 450 190 \
            "${{ github.workspace }}/${{ matrix.artifact-name }}-${{ env.APP_VERSION }}.dmg" \
            .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}-${{ env.APP_VERSION }}.*
          if-no-files-found: error

  release:
    name: 发布草稿 Release
    needs: build
    runs-on: ubuntu-latest
    # job 级 if 只用可靠上下文（github.event_name）；是否发版、版本号在 step 里判断（读 github.event.inputs）
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      # 打 tag（=决定发版）或手动勾选「创建草稿 Release」才发版；手动纯构建则跳过
      - name: 计算发版计划
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.create_draft_release }}" = "true" ]; then
            if [ -z "${{ github.event.inputs.release_version }}" ]; then
              echo "已勾选「创建草稿 Release」但未填写版本号，请填写如 v1.0.1"
              exit 1
            fi
            # 手动发版版本号格式校验：vX.Y.Z 或 X.Y.Z
            if [[ ! "${{ github.event.inputs.release_version }}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "版本号格式不正确，应为 vX.Y.Z（或 X.Y.Z），例如 v1.0.1"
              exit 1
            fi
            # 兼容手动填写时漏掉 v 前缀：统一补 v，保证 tag、Release 名称、CHANGELOG 段落匹配一致
            VERSION="${{ github.event.inputs.release_version }}"
            [[ "$VERSION" =~ ^v ]] || VERSION="v$VERSION"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # release job 默认无工作区，读取 CHANGELOG.md 前必须先检出代码
      - name: 检出代码（读取 CHANGELOG 用）
        if: steps.plan.outputs.release == 'true'
        uses: actions/checkout@v4

      # 从仓库 docs/CHANGELOG.md 提取当前版本段落，作为 Release notes 写入文件
      - name: 提取发版说明
        if: steps.plan.outputs.release == 'true'
        env:
          # 该 tag 已由「计算发版计划」统一规范为 v 前缀
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          tag = os.environ["RELEASE_TAG"].strip()
          norm = tag if tag.startswith("v") else "v" + tag  # 防御性再补一次 v

          path = "docs/CHANGELOG.md"
          try:
              with open(path, encoding="utf-8") as f:
                  content = f.read()
          except FileNotFoundError:
              print(f"错误：仓库中未找到 {path}，请确认该文件已提交后再发版")
              sys.exit(1)

          # 精确匹配段落标题：要求 "]" 紧跟版本号后，避免 v0.0.1 误匹配到 v0.0.10
          header = re.compile(r"^## \[" + re.escape(norm) + r"\] - ", re.MULTILINE)
          m = header.search(content)
          if not m:
              print(f"错误：在 {path} 中未找到版本 [{norm}] 对应的段落，请先提交该版本的 changelog 后再发版")
              sys.exit(1)

          # 跳过标题行本身，正文从标题下一行开始（兼容 CRLF）
          body_start = content.index("\n", m.end()) + 1
          region = content[body_start:]
          # 段落到下一个 "## " 开头的行为止（### 子标题不属于段落边界）
          end = re.search(r"^## ", region, re.MULTILINE)
          body = region[: end.start()] if end else region

          # 清理段首/段尾空行，保证末尾单换行
          body = body.strip() + "\n"
          if body == "\n":
              print(f"错误：版本 [{norm}] 的段落内容为空，无法生成发布说明")
              sys.exit(1)

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(body)
          print(f"已提取 [{norm}] 段落的发布说明，共 {len(body)} 字节")
          PY

      - name: 下载全部构建产物
        if: steps.plan.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 创建草稿 Release 并上传产物
        if: steps.plan.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ steps.plan.outputs.tag }}
          name: Anki划词助手 ${{ steps.plan.outputs.tag }}
          # 改用 CHANGELOG 提取的说明，不再使用 GitHub 自动生成的 release notes
          body_path: release-notes.md
          draft: true